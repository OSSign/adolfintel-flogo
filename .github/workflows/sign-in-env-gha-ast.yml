name: Build and Sign

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'The source branch or ref to build from'
        default: 'master'
        required: true

      release_name:
        description: 'The name for the release'
        required: true


env:
  SOURCE_REPOSITORY: 'adolfintel/flogo'
  SOURCE_REPOSITORY_NAME: 'flogo'

jobs:
  sign:
    environment: OSSign
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ github.event.inputs.source_branch }}
      
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: ossign

      - uses: ossign/ossign@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          installOnly: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Install dependencies and prepare for signing
        shell: bash
        run: |
          npm ci
          npm i @ossign/ossign
          # Add the ./ossign/sign.cjs to build.win.signtoolOptions.sign in package.json
          cat package.json | jq '.build.win.signtoolOptions.sign = "./ossign/sign.cjs"' > package.tmp.json && mv package.tmp.json package.json
      
      - name: Get Version
        run: |
            $version = node -p "require('./package.json').version"
            echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build and Sign
        shell: bash
        env:
          OSSIGN_CONFIG: ${{ secrets.OSSIGN_CONFIG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run electron:build-win-x64-installer
          npm run electron:build-win-arm64-installer

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          name: ${{ github.event.inputs.release_name }}
          tag_name: ${{ github.run_id }}
          body: |
            <img src="https://github.com/ossign.png" alt="OSSign Logo" width="100" height="100" />
            # Signed Release ${{ github.event.inputs.release_name }}
            
            These are the distributable files for the signed release of ${{ env.SOURCE_REPOSITORY_NAME }} ${{ github.event.inputs.release_name }}

            The source code was fetched from https://github.com/${{ env.SOURCE_REPOSITORY }}@${{ github.event.inputs.source_branch }}
            
          


